name: Reliability checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTO_CONNECT_RTDE: '0'
      MASSAGE_SIMULATION_MODE: '0'
      ENABLE_AZURE_SPEECH_STT: 'false'
      AZURE_SPEECH_KEY: ''
      AZURE_SPEECH_REGION: ''
      PORT: '15033'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci
      - name: Audit Python dependencies in a separate environment
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install pip-audit==2.10.1
          .audit-venv/bin/pip-audit -r requirements.lock.txt --no-deps --disable-pip
      - run: npm audit
      - run: npx playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: npm test
      - run: npm run test:e2e -- --workers=2
        env:
          TEST_START_SERVER: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
